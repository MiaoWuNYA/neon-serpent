<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#03000c" />
<meta name="color-scheme" content="dark" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="NEON SERPENT" />
<title>NEON SERPENT · 霓虹蛇域</title>
<meta name="description" content="NEON SERPENT 霓虹蛇域 — 次世代 WebGL2 全息贪吃蛇。HDR 泛光、体积光星域、动态相机、60fps。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23050016'/%3E%3Ccircle cx='20' cy='32' r='7' fill='%2300ffd5'/%3E%3Ccircle cx='36' cy='32' r='5.4' fill='%236366f1'/%3E%3Ccircle cx='50' cy='32' r='4' fill='%23f472b6'/%3E%3C/svg%3E" />
<link rel="manifest" href="manifest.webmanifest" />

<!-- ============ 首屏加载遮罩（内联样式，先于一切渲染，避免白闪） ============ -->
<style>
  html,body{margin:0;padding:0;background:#03000c;overflow:hidden;overscroll-behavior:none;touch-action:none;}
  #boot{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 40%,#12003a 0%,#06001a 45%,#03000c 100%);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#cfd6ff;
    transition:opacity .9s cubic-bezier(.16,1,.3,1);}
  #boot.hide{opacity:0;pointer-events:none;}
  #boot .logo{font-size:clamp(26px,7vw,62px);letter-spacing:.34em;font-weight:800;
    background:linear-gradient(92deg,#00ffd5,#7c9dff 42%,#f472b6 78%,#ffd36e);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 26px rgba(0,255,213,.42));animation:breathe 2.6s ease-in-out infinite;}
  #boot .sub{margin-top:10px;font-size:clamp(10px,2.6vw,13px);letter-spacing:.5em;color:#6f7ab8;text-transform:uppercase;}
  #boot .bar{margin-top:34px;width:min(62vw,320px);height:3px;border-radius:99px;background:rgba(120,140,255,.14);overflow:hidden;}
  #boot .bar > i{display:block;height:100%;width:0%;border-radius:99px;
    background:linear-gradient(90deg,#00ffd5,#6366f1,#f472b6);box-shadow:0 0 16px rgba(0,255,213,.7);
    transition:width .35s cubic-bezier(.16,1,.3,1);}
  #boot .tip{margin-top:16px;font-size:clamp(10px,2.5vw,12px);color:#5a6394;letter-spacing:.08em;}
  @keyframes breathe{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.86;transform:scale(1.014)}}
  canvas{display:block;}
</style>
</head>
<body>

<div id="boot">
  <div class="logo">NEON SERPENT</div>
  <div class="sub">霓虹蛇域</div>
  <div class="bar"><i id="bootbar"></i></div>
  <div class="tip" id="boottip">正在编译着色器…</div>
</div>

<!-- ============ 渲染画布 ============ -->
<canvas id="gl"></canvas>

<!-- ============ HUD / UI 层（由 src/ui.js 注入） ============ -->
<div id="hud"></div>

<style id="uicss"></style>

<!-- ============ 启动引导：按优先级加载 three.js，全部失败则报错 ============ -->
<script>
(function () {
  var CDN = [
    "vendor/three.min.js",
    "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js",
    "https://unpkg.com/three@0.160.1/build/three.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.1/three.min.js"
  ];
  var bar = document.getElementById("bootbar");
  var tip = document.getElementById("boottip");
  var done = false;

  window.__NEON_READY = function () { done = true; };
  function progress(p, t) {
    if (bar) bar.style.width = Math.round(p * 100) + "%";
    if (t && tip) tip.textContent = t;
  }
  window.__NEON_PROGRESS = progress;

  function tryLoad(i) {
    if (done) return;
    if (i >= CDN.length) {
      if (tip) { tip.innerHTML = "渲染引擎加载失败<br>请检查网络后刷新页面"; tip.style.color = "#ff7c9c"; }
      return;
    }
    progress(0.06 + i * 0.06, "正在加载渲染引擎 " + (i + 1) + "/" + CDN.length + " …");
    var s = document.createElement("script");
    s.src = CDN[i];
    s.async = false;
    s.onload = function () {
      if (window.THREE && window.THREE.WebGLRenderer) {
        progress(0.3, "正在编译着色器…");
        loadGame();
      } else {
        tryLoad(i + 1);
      }
    };
    s.onerror = function () { tryLoad(i + 1); };
    document.head.appendChild(s);
  }

  // 致命错误统一出口：无论卡在哪一步，都要让用户看到原因而不是无限等待
  function fatal(msg) {
    if (done) return;
    if (tip) {
      tip.innerHTML = msg + "<br><span style='opacity:.72;font-size:.92em'>请刷新页面重试</span>";
      tip.style.color = "#ff7c9c";
    }
    if (bar) bar.style.background = "linear-gradient(90deg,#ff4d6d,#ff7c9c)";
    var b = document.getElementById("boot");
    if (b) b.classList.remove("hide");   // 出错时确保遮罩可见（承载错误信息）
  }
  window.__NEON_FATAL = fatal;

  function loadGame() {
    var files = ["src/util.js", "src/audio.js", "src/ui.js", "src/scene.js", "src/game.js", "src/main.js"];
    var k = 0;
    (function next() {
      // 全部脚本就绪：进入引擎初始化。此时进度交给 main.js 继续推进。
      if (k >= files.length) {
        progress(0.86, "正在构建场景…");
        // 兜底：若 12 秒内没收到 READY（init 静默失败/死循环），主动报错
        if (!window.__NEON_BOOT_GUARD) {
          window.__NEON_BOOT_GUARD = setTimeout(function () {
            if (!done) fatal("初始化超时，渲染管线可能不受支持");
          }, 12000);
        }
        return;
      }
      var idx = k++;
      var s = document.createElement("script");
      s.src = files[idx];
      s.async = false;
      s.onload = function () {
        progress(0.30 + (idx + 1) / files.length * 0.52, "正在装配模块 " + (idx + 1) + "/" + files.length + " …");
        next();
      };
      s.onerror = function () { fatal("模块加载失败：" + files[idx]); };
      document.body.appendChild(s);
    })();
  }

  if (window.THREE) { progress(0.3, "正在编译着色器…"); loadGame(); }
  else tryLoad(0);
})();
</script>

</body>
</html>
